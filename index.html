<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warcraft Lore – Chronologie</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #e8e8e8;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        padding: 20px;
    }
    h1 {
        text-align: center; font-size: 1.7rem; margin: 0 0 8px 0;
        letter-spacing: 1px;
    }
    h1 .logo-yellow {
        color: #F8B700;
        text-shadow: 0 0 22px rgba(248, 183, 0, 0.45), 0 0 4px rgba(248, 183, 0, 0.6);
    }
    .subtitle {
        text-align: center; color: #9ca3af; margin-bottom: 18px;
        font-size: 0.85rem; line-height: 1.6;
        max-width: 760px; margin-left: auto; margin-right: auto;
    }
    .subtitle b { color: #c4b5fd; }

    .timeline-wrap {
        width: 100%; max-width: 1200px; margin: 0 auto;
        background: #0f0f1a;
        border: 1px solid #2a2a3e;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        overflow: auto;
        position: relative;
        height: 720px;
    }
    .timeline-wrap::-webkit-scrollbar { width: 12px; height: 12px; }
    .timeline-wrap::-webkit-scrollbar-track {
        background: #1a1a2e; border-radius: 7px;
    }
    .timeline-wrap::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #7c3aed, #2563eb, #16a34a, #ef4444, #8b5cf6);
        border-radius: 7px; border: 2px solid #1a1a2e;
    }
    .timeline-wrap { scrollbar-color: #7c3aed #1a1a2e; scrollbar-width: auto; }

    .timeline-layout {
        display: flex;
        position: relative;
        min-height: 100%;
    }

    /* ---- Vertikale Zeitachse (links, sticky horizontal) ---- */
    .axis-v {
        position: sticky;
        left: 0;
        width: 100px;
        flex-shrink: 0;
        background: #0f0f1a;
        border-right: 1px solid #2a2a3e;
        z-index: 20;
        /* Höhe wird dynamisch gesetzt */
    }
    .axis-tick-v {
        position: absolute;
        left: 0;
        width: 100%;
        padding: 4px 10px 0 8px;
        font-size: 0.7rem;
        color: #9ca3af;
        border-top: 1px dashed #3a3a5e;
        white-space: nowrap;
        text-align: right;
    }
    .axis-tick-v.timeless {
        color: #c4b5fd;
        font-style: italic;
    }

    /* ---- Canvas mit Gruppen & Items ---- */
    .canvas-v {
        position: relative;
        flex: 1;
        min-width: 800px;
        /* Höhe wird dynamisch gesetzt */
    }

    /* ---- Gruppen-Header (horizontal, volle Breite) ---- */
    .group-header-v {
        position: absolute;
        left: 0;
        right: 0;
        height: 38px;
        line-height: 38px;
        padding: 0 20px;
        background: linear-gradient(90deg, rgba(124,58,237,0.15) 0%, rgba(124,58,237,0.05) 60%, transparent 100%);
        border-top: 1px solid rgba(196,181,253,0.25);
        border-bottom: 1px solid rgba(196,181,253,0.15);
        font-size: 0.95rem;
        font-weight: 600;
        color: #c4b5fd;
        letter-spacing: 1px;
        z-index: 4;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .group-header-v::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: #7c3aed;
    }

    /* ---- Items ---- */
    .item-v {
        position: absolute;
        background: #3b2680ff;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s;
        display: flex;
        flex-direction: column;
        justify-content: center;
        user-select: text;
        border-left: 3px solid #e91e8c;
        overflow: hidden;
        z-index: 3;
    }
    .item-v:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
        z-index: 6;
    }
    .item-v .item-zeit {
        font-size: 0.65rem;
        color: rgba(255,255,255,0.75);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .item-v .item-titel {
        font-size: 0.82rem;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ---- Pfeile ---- */
    .arrows-v {
        position: absolute;
        top: 0; left: 0;
        pointer-events: none;
        z-index: 1;
        width: 100%;
    }

    /* ---- Tooltip & Toast ---- */
    .tooltip {
        position: fixed;
        background: rgba(20, 20, 35, 0.97);
        color: #e8e8e8;
        padding: 12px 16px;
        border: 1px solid #4a4a6e;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.7);
        max-width: 360px;
        font-size: 13px;
        line-height: 1.55;
        z-index: 99999;
        pointer-events: none;
        display: none;
    }
    .tooltip b { color: #f59e0b; }
    .tooltip i { color: #9ca3af; }

    .toast {
        position: fixed;
        bottom: 30px; left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(20, 20, 35, 0.96);
        color: #c4b5fd;
        padding: 10px 20px;
        border: 1px solid #4a4a6e;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.6);
        font-size: 0.9rem;
        opacity: 0;
        transition: opacity 0.25s, transform 0.25s;
        pointer-events: none;
        z-index: 10000;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .status {
        text-align: center; color: #c4b5fd; font-size: 0.85rem;
        margin-top: 12px; min-height: 20px;
    }
    .status.error { color: #ef4444; }
</style>
</head>
<body>

<h1><span class="logo-yellow">Warcraft Lore – Chronologie</span></h1>
<p class="subtitle">
    <b>BDP</b> = Before Dark Portal (vor dem Dunklen Portal) · <b>ADP</b> = After Dark Portal (nach dem Dunklen Portal)
</p>

<div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-layout" id="timelineLayout">
        <div class="axis-v" id="axisV"></div>
        <div class="canvas-v" id="canvasV">
            <svg class="arrows-v" id="arrowsV"></svg>
            <div id="sectionsLayer"></div>
            <div id="itemsLayer"></div>
        </div>
    </div>
</div>

<div class="status" id="status">Lade Daten…</div>

<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// KONFIGURATION
// ============================================================
const CONFIG = {
    sheetUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGtORIe7TdQLBiXK6qmWcoC-z-ixoYzMOwySVpKdj0mHxRtH769Hl_HNz6FCdL4u5NMLUPJcfQ3EvZ/pub?output=csv',

    pxPerYear: 0.55,           // Höhe pro Jahr
    minItemHeight: 44,         // Mindesthöhe eines Items
    columnWidth: 240,          // Breite eines Items
    columnGap: 12,             // Abstand zwischen Sub-Spalten
    canvasPaddingTop: 30,      // Platz oben
    canvasPaddingBottom: 60,   // Platz unten
    groupHeaderHeight: 38,     // Höhe des Gruppen-Headers
    groupHeaderPadding: 20,    // Abstand zwischen Header und erstem Item
    timelessThreshold: -11500,
    tickInterval: 500,
};

// ============================================================
// PFEIL-FARBEN
// ============================================================
const ARROW_COLORS = [
    '#8a8a8a', '#d4c5a0', '#a8a8a8', '#c9b896', '#b0b0b0',
    '#b8a880', '#7a7a7a', '#e0d5b8', '#9a9a9a', '#cfc1a0',
];

// ============================================================
// DEMO-DATEN
// ============================================================
const DEMO_DATA = [
    { id:'licht', gruppe:'🌌 ZEITLOS', start:-12100, end:-12000, icon:'🌌', zeit:'Zeitlos', titel:'Licht und Leere', farbe:'#7c3aed', tooltip:'<b>🌌 Licht und Leere</b>', deps:['naaru','alte_goetter'] },
    { id:'naaru', gruppe:'🌌 ZEITLOS', start:-11900, end:-11800, icon:'✨', zeit:'Zeitlos', titel:'Die Naaru', farbe:'#2563eb', tooltip:'<b>✨ Die Naaru</b>', deps:['titanen'] },
    { id:'alte_goetter', gruppe:'🌌 ZEITLOS', start:-11700, end:-11600, icon:'🔮', zeit:'Zeitlos', titel:'Die Alten Götter', farbe:'#dc2626', tooltip:'<b>🔮 Die Alten Götter</b>', deps:['titanen','loken'] },
    { id:'titanen', gruppe:'⚡ Kosmische Urzeit', start:-10000, end:-9900, icon:'⚡', zeit:'~10.000 BDP', titel:'Die Titanen', farbe:'#d97706', tooltip:'<b>⚡ Die Titanen</b>', deps:['sargeras','nachtelfen'] },
    { id:'sargeras', gruppe:'⚡ Kosmische Urzeit', start:-9500, end:-9400, icon:'🔥', zeit:'~9.500 BDP', titel:'Sargeras fällt', farbe:'#16a34a', tooltip:'<b>🔥 Sargeras fällt</b>', deps:['legion'] },
    { id:'loken', gruppe:'⚡ Kosmische Urzeit', start:-9000, end:-8900, icon:'🗡️', zeit:'~9.000 BDP', titel:'Loken verrät Thorim', farbe:'#b91c1c', tooltip:'<b>🗡️ Loken verrät Thorim</b>', deps:['arthas'] },
    { id:'legion', gruppe:'⚔️ Antike', start:-8000, end:-7900, icon:'💀', zeit:'~8.000 BDP', titel:'Brennende Legion', farbe:'#15803d', tooltip:'<b>💀 Brennende Legion</b>', deps:['krieg_antike'] },
    { id:'nachtelfen', gruppe:'⚔️ Antike', start:-7800, end:-7700, icon:'🌙', zeit:'~7.800 BDP', titel:'Die ersten Nachtelfen', farbe:'#9333ea', tooltip:'<b>🌙 Die ersten Nachtelfen</b>', deps:['brunnen'] },
    { id:'brunnen', gruppe:'⚔️ Antike', start:-7600, end:-7500, icon:'💧', zeit:'~7.600 BDP', titel:'Brunnen der Ewigkeit', farbe:'#06b6d4', tooltip:'<b>💧 Brunnen der Ewigkeit</b>', deps:['krieg_antike'] },
    { id:'krieg_antike', gruppe:'⚔️ Antike', start:-7400, end:-7000, icon:'⚔️', zeit:'~7.400 BDP', titel:'Krieg der Antike', farbe:'#a855f7', tooltip:'<b>⚔️ Krieg der Antike</b>', deps:['sundbrunnen','kaldorei'] },
    { id:'sundbrunnen', gruppe:'⚔️ Antike', start:-7000, end:-6900, icon:'☀️', zeit:'~7.000 BDP', titel:'Sonnenbrunnen', farbe:'#f59e0b', tooltip:'<b>☀️ Sonnenbrunnen</b>', deps:['illidan'] },
    { id:'kaldorei', gruppe:'💀 Moderne', start:-4000, end:-3900, icon:'🌲', zeit:'~4.000 BDP', titel:'Kaldorei-Reich', farbe:'#10b981', tooltip:'<b>🌲 Kaldorei-Reich</b>', deps:['illidan'] },
    { id:'arthas', gruppe:'💀 Moderne', start:20, end:21, icon:'💀', zeit:'20 ADP', titel:'Arthas wird Lichkönig', farbe:'#ef4444', tooltip:'<b>💀 Arthas wird Lichkönig</b>', deps:['illidan'] },
    { id:'illidan', gruppe:'💀 Moderne', start:21, end:22, icon:'👁️', zeit:'21 ADP', titel:'Illidan erwacht', farbe:'#8b5cf6', tooltip:'<b>👁️ Illidan erwacht</b>', deps:[] },
];

// ============================================================
// CSV-PARSER
// ============================================================
function parseCSV(text) {
    const rows = [];
    let row = [], cur = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"') {
                if (text[i+1] === '"') { cur += '"'; i++; }
                else inQuotes = false;
            } else cur += c;
        } else {
            if (c === '"') inQuotes = true;
            else if (c === ',') { row.push(cur); cur = ''; }
            else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
            else if (c === '\r') { /* ignore */ }
            else cur += c;
        }
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
}

// ============================================================
// DATEN LADEN
// ============================================================
async function loadData() {
    if (!CONFIG.sheetUrl) return DEMO_DATA;
    const res = await fetch(CONFIG.sheetUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const rows = parseCSV(csv);
    if (rows.length < 2) throw new Error('Keine Daten im Sheet');

    return rows.slice(1)
        .filter(r => r[0] && r[0].trim())
        .map(r => ({
            gruppe: (r[0] || '').trim(),
            icon: (r[1] || '').trim(),
            titel: (r[2] || '').trim(),
            zeit: (r[3] || '').trim(),
            start: parseInt(r[4], 10),
            end: r[5] ? parseInt(r[5], 10) : null,
            farbe: (r[6] || '#3b2680').trim(),
            id: (r[7] || '').trim(),
            deps: (r[8] || '').split(',').map(s => s.trim()).filter(Boolean),
            tooltip: (r[9] || '').trim(),
        }))
        .filter(r => !isNaN(r.start) && r.id);
}

// ============================================================
// RENDER
// ============================================================
function render(data) {
    const startYear = Math.min(...data.map(d => d.start));
    const endYear   = Math.max(...data.map(d => d.end || d.start));
    const rangeStart = Math.floor((startYear - 400) / 500) * 500;
    const rangeEnd   = Math.ceil((endYear + 300) / 500) * 500;
    const totalYears = rangeEnd - rangeStart;

    const axisV = document.getElementById('axisV');
    const canvasV = document.getElementById('canvasV');
    const arrowsV = document.getElementById('arrowsV');
    const sectionsLayer = document.getElementById('sectionsLayer');
    const itemsLayer = document.getElementById('itemsLayer');

    axisV.innerHTML = '';
    sectionsLayer.innerHTML = '';
    itemsLayer.innerHTML = '';
    arrowsV.innerHTML = '';

    // Höhe berechnen
    const rangeHeight = totalYears * CONFIG.pxPerYear;
    const totalHeight = rangeHeight + CONFIG.canvasPaddingTop + CONFIG.canvasPaddingBottom;

    axisV.style.height = totalHeight + 'px';
    canvasV.style.height = totalHeight + 'px';
    arrowsV.setAttribute('height', totalHeight);
    arrowsV.setAttribute('viewBox', `0 0 800 ${totalHeight}`);
    arrowsV.style.height = totalHeight + 'px';

    // Achse
    for (let y = rangeStart; y <= rangeEnd; y += CONFIG.tickInterval) {
        const yPos = CONFIG.canvasPaddingTop + (y - rangeStart) * CONFIG.pxPerYear;
        const tick = document.createElement('div');
        tick.className = 'axis-tick-v';

        const isTimeless = y < CONFIG.timelessThreshold;
        if (isTimeless) {
            tick.classList.add('timeless');
            tick.textContent = 'Zeitlos';
        } else if (y < 0) {
            tick.textContent = Math.abs(y) + ' BDP';
        } else {
            tick.textContent = y + ' ADP';
        }

        tick.style.top = yPos + 'px';
        axisV.appendChild(tick);
    }

    // Gruppen in Reihenfolge
    const groupOrder = [];
    const groupMap = {};
    for (const item of data) {
        if (!groupMap[item.gruppe]) {
            groupMap[item.gruppe] = [];
            groupOrder.push(item.gruppe);
        }
        groupMap[item.gruppe].push(item);
    }

    // ──────────────────────────────────────────────────
    // Y-Position jedes Items berechnen
    // ──────────────────────────────────────────────────
    const sorted = [...data].sort((a, b) => a.start - b.start);
    const itemY = {};   // id -> {y, h}
    for (const item of sorted) {
        const y = CONFIG.canvasPaddingTop + (item.start - rangeStart) * CONFIG.pxPerYear;
        const h = Math.max(((item.end || item.start) - item.start) * CONFIG.pxPerYear, CONFIG.minItemHeight);
        itemY[item.id] = { y, h };
    }

    // ──────────────────────────────────────────────────
    // Gruppen-Header positionieren (jeweils über dem ersten Item der Gruppe)
    // ──────────────────────────────────────────────────
    const groupHeaderY = {};
    let lastBottom = 0;

    for (const groupName of groupOrder) {
        const items = groupMap[groupName].slice().sort((a, b) => a.start - b.start);
        const firstItem = items[0];
        let headerY = itemY[firstItem.id].y - CONFIG.groupHeaderHeight - 8;

        // Nicht mit vorheriger Gruppe überlappen
        if (headerY < lastBottom + 4) {
            headerY = lastBottom + 4;
        }
        groupHeaderY[groupName] = headerY;

        const headerEl = document.createElement('div');
        headerEl.className = 'group-header-v';
        headerEl.style.top = headerY + 'px';
        headerEl.textContent = groupName;
        sectionsLayer.appendChild(headerEl);

        // Letzte Item-Unterkante der Gruppe finden
        let groupBottom = headerY + CONFIG.groupHeaderHeight + CONFIG.groupHeaderPadding;
        for (const item of items) {
            const b = itemY[item.id].y + itemY[item.id].h;
            if (b > groupBottom) groupBottom = b;
        }
        lastBottom = groupBottom;
    }

    // ──────────────────────────────────────────────────
    // Sub-Spalten (Overlap-Vermeidung)
    // ──────────────────────────────────────────────────
    const columnEnds = [];
    const itemColumn = {};
    for (const item of sorted) {
        const { y, h } = itemY[item.id];
        let col = 0;
        for (; col < columnEnds.length; col++) {
            if (columnEnds[col] + 6 <= y) break;
        }
        if (col === columnEnds.length) columnEnds.push(0);
        columnEnds[col] = y + h;
        itemColumn[item.id] = col;
    }

    const canvasWidth = Math.max(
        CONFIG.columnWidth * columnEnds.length + CONFIG.columnGap * (columnEnds.length - 1) + 60,
        800
    );
    canvasV.style.minWidth = canvasWidth + 'px';
    arrowsV.setAttribute('width', canvasWidth);
    arrowsV.setAttribute('viewBox', `0 0 ${canvasWidth} ${totalHeight}`);

    const itemX = {};
    for (const item of sorted) {
        const col = itemColumn[item.id];
        itemX[item.id] = 30 + col * (CONFIG.columnWidth + CONFIG.columnGap);
    }

    // ──────────────────────────────────────────────────
    // Items zeichnen
    // ──────────────────────────────────────────────────
    const itemPositions = {};
    for (const item of sorted) {
        const { y, h } = itemY[item.id];
        const x = itemX[item.id];
        const w = CONFIG.columnWidth;

        const el = document.createElement('div');
        el.className = 'item-v';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.background = item.farbe;
        el.dataset.id = item.id;

        el.innerHTML =
            '<div class="item-zeit">' + escapeHtml(item.icon + ' ' + item.zeit) + '</div>' +
            '<div class="item-titel">' + escapeHtml(item.titel) + '</div>';

        itemsLayer.appendChild(el);

        itemPositions[item.id] = { x, y, w, h, item };
    }

    // ──────────────────────────────────────────────────
    // Pfeile zeichnen
    // ──────────────────────────────────────────────────
    let arrowIndex = 0;
    for (const id in itemPositions) {
        const src = itemPositions[id];
        for (const targetId of src.item.deps) {
            const dst = itemPositions[targetId];
            if (!dst) continue;

            const color = ARROW_COLORS[arrowIndex % ARROW_COLORS.length];
            arrowIndex++;

            // Von Unterkante Quelle → Oberkante Ziel
            const x1 = src.x + src.w / 2;
            const y1 = src.y + src.h;
            const x2 = dst.x + dst.w / 2;
            const y2 = dst.y;

            const dy = y2 - y1;
            let pathD;

            if (dy > 10) {
                // Nach unten – Kurve
                const cy = y1 + dy * 0.5;
                pathD = `M ${x1} ${y1} C ${x1} ${cy}, ${x2} ${cy}, ${x2} ${y2}`;
            } else {
                // Rückwärts / gleiche Höhe – Bogen
                const midX = (x1 + x2) / 2 + (x2 > x1 ? 60 : -60);
                pathD = `M ${x1} ${y1} Q ${midX} ${(y1 + y2) / 2 + 30}, ${x2} ${y2}`;
            }

            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', pathD);
            p.setAttribute('fill', 'none');
            p.setAttribute('stroke', color);
            p.setAttribute('stroke-width', '1.6');
            p.setAttribute('stroke-linecap', 'round');
            arrowsV.appendChild(p);

            // Pfeilspitze (zeigt nach unten)
            const size = 7;
            const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            arrow.setAttribute('points',
                `${x2},${y2} ${x2 - size/2},${y2 - size} ${x2 + size/2},${y2 - size}`);
            arrow.setAttribute('fill', color);
            arrowsV.appendChild(arrow);
        }
    }

    // Interaktion
    attachInteractions(data);
}

// ============================================================
// INTERAKTION
// ============================================================
function attachInteractions(data) {
    const tooltip = document.getElementById('tooltip');

    document.querySelectorAll('.item-v').forEach(el => {
        el.addEventListener('mouseenter', (e) => {
            const id = el.dataset.id;
            const item = data.find(d => d.id === id);
            if (!item) return;
            tooltip.innerHTML = item.tooltip;
            tooltip.style.display = 'block';
            positionTooltip(e);
        });
        el.addEventListener('mousemove', positionTooltip);
        el.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
        });
        el.addEventListener('click', () => {
            const id = el.dataset.id;
            const item = data.find(d => d.id === id);
            if (!item) return;
            const text = htmlToPlain(item.tooltip);
            navigator.clipboard.writeText(text)
                .then(() => showToast('📋 „' + text.split('\n')[0] + '" kopiert!'))
                .catch(() => showToast('⚠️ Kopieren fehlgeschlagen – HTTPS nötig'));
        });
    });

    function positionTooltip(e) {
        const padding = 14;
        let x = e.clientX + padding;
        let y = e.clientY + padding;
        const rect = tooltip.getBoundingClientRect();
        if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - padding;
        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - padding;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
    }
}

// ============================================================
// HELFER
// ============================================================
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}
function htmlToPlain(html) {
    return html
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/p>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}
let toastTimer = null;
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

(async function init() {
    const status = document.getElementById('status');
    try {
        const data = await loadData();
        status.textContent = data.length + ' Ereignisse geladen.';
        setTimeout(() => status.style.display = 'none', 1500);
        render(data);
    } catch (err) {
        console.error(err);
        status.classList.add('error');
        status.textContent = '❌ Fehler beim Laden: ' + err.message;
    }
})();
</script>
