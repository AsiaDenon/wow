<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warcraft Lore – Chronologie</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #e8e8e8;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        padding: 20px;
    }
    h1 {
        text-align: center; font-size: 1.7rem; margin: 0 0 8px 0;
        letter-spacing: 1px;
    }
    h1 .logo-yellow {
        color: #F8B700;
        text-shadow: 0 0 22px rgba(248, 183, 0, 0.45), 0 0 4px rgba(248, 183, 0, 0.6);
    }
    .subtitle {
        text-align: center; color: #9ca3af; margin-bottom: 18px;
        font-size: 0.85rem; line-height: 1.6;
        max-width: 760px; margin-left: auto; margin-right: auto;
    }
    .subtitle b { color: #c4b5fd; }

    .timeline-wrap {
        width: 100%; max-width: 1600px; margin: 0 auto;
        background: #0f0f1a;
        border: 1px solid #2a2a3e;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        overflow: auto;
        position: relative;
        max-height: 720px;
    }
    .timeline-wrap::-webkit-scrollbar { height: 14px; width: 12px; }
    .timeline-wrap::-webkit-scrollbar-track {
        background: #1a1a2e; border-radius: 7px;
    }
    .timeline-wrap::-webkit-scrollbar-thumb {
        background: linear-gradient(90deg, #7c3aed, #2563eb, #16a34a, #ef4444, #8b5cf6);
        border-radius: 7px; border: 2px solid #1a1a2e;
    }
    .timeline-wrap { scrollbar-color: #7c3aed #1a1a2e; scrollbar-width: auto; }

    .timeline-inner {
        position: relative;
        /* width wird dynamisch gesetzt */
    }
    .arrows {
        position: absolute; top: 0; left: 0;
        pointer-events: none;
        z-index: 1;
    }
    .groups-layer {
        position: relative;
        z-index: 2;
    }
    .group {
        position: relative;
    }
    .group-header {
        position: sticky; left: 0;
        display: inline-block;
        padding: 8px 16px 8px 14px;
        background: linear-gradient(90deg, rgba(20,20,35,0.98) 0%, rgba(20,20,35,0.85) 80%, transparent 100%);
        font-size: 0.95rem;
        font-weight: 600;
        color: #c4b5fd;
        letter-spacing: 0.5px;
        z-index: 10;
        pointer-events: none;
    }
    .group-body {
        position: relative;
        /* height wird dynamisch gesetzt */
    }
    .item {
        position: absolute;
        background: #3b2680ff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s;
        display: flex;
        flex-direction: column;
        justify-content: center;
        user-select: text;
        border-left: 3px solid #e91e8c;
        overflow: hidden;
    }
    .item:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
    }
    .item .item-zeit {
        font-size: 0.7rem;
        color: rgba(255,255,255,0.75);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .item .item-titel {
        font-size: 0.82rem;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .tooltip {
        position: fixed;
        background: rgba(20, 20, 35, 0.97);
        color: #e8e8e8;
        padding: 12px 16px;
        border: 1px solid #4a4a6e;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.7);
        max-width: 360px;
        font-size: 13px;
        line-height: 1.55;
        z-index: 99999;
        pointer-events: none;
        display: none;
    }
    .tooltip b { color: #f59e0b; }
    .tooltip i { color: #9ca3af; }

    .toast {
        position: fixed;
        bottom: 30px; left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(20, 20, 35, 0.96);
        color: #c4b5fd;
        padding: 10px 20px;
        border: 1px solid #4a4a6e;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.6);
        font-size: 0.9rem;
        opacity: 0;
        transition: opacity 0.25s, transform 0.25s;
        pointer-events: none;
        z-index: 10000;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .status {
        text-align: center; color: #c4b5fd; font-size: 0.85rem;
        margin-top: 12px; min-height: 20px;
    }
    .status.error { color: #ef4444; }

    /* Zeitachse */
    .axis {
        position: sticky; bottom: 0; left: 0;
        height: 40px;
        background: linear-gradient(180deg, transparent 0%, rgba(15,15,26,0.95) 40%, #0f0f1a 100%);
        pointer-events: none;
        z-index: 5;
    }
    .axis-tick {
        position: absolute;
        top: 12px;
        height: 28px;
        border-left: 1px dashed #3a3a5e;
        font-size: 0.72rem;
        color: #9ca3af;
        padding-left: 4px;
        white-space: nowrap;
    }
</style>
</head>
<body>

<h1><span class="logo-yellow">Warcraft Lore – Chronologie</span></h1>
<p class="subtitle">
    <b>BDP</b> = Before Dark Portal (vor dem Dunklen Portal) · <b>ADP</b> = After Dark Portal (nach dem Dunklen Portal)
</p>

<div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-inner" id="timelineInner">
        <svg class="arrows" id="arrows"></svg>
        <div class="groups-layer" id="groupsLayer"></div>
    </div>
</div>

<div class="status" id="status">Lade Daten…</div>

<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// KONFIGURATION
// ============================================================
const CONFIG = {
    sheetUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGtORIe7TdQLBiXK6qmWcoC-z-ixoYzMOwySVpKdj0mHxRtH769Hl_HNz6FCdL4u5NMLUPJcfQ3EvZ/pub?output=csv',

    pxPerYear: 0.55,
    rowHeight: 46,
    rowGap: 4,
    groupHeaderHeight: 36,
    groupPaddingBottom: 12,
    minItemWidth: 130,
    timelessThreshold: -11500,
    tickInterval: 500,
};

// ============================================================
// PFEIL-FARBEN – alternierend grau/beige für Kreuzungen
// ============================================================
const ARROW_COLORS = [
    '#8a8a8a', // grau
    '#d4c5a0', // helles beige
    '#a8a8a8', // helleres grau
    '#c9b896', // beige
    '#b0b0b0', // grau
    '#b8a880', // warmes beige
    '#7a7a7a', // dunkelgrau
    '#e0d5b8', // sehr helles beige
    '#9a9a9a', // grau
    '#cfc1a0', // beige
];

// ============================================================
// DEMO-DATEN
// ============================================================
const DEMO_DATA = [
    { id:'licht', gruppe:'🌌 ZEITLOS', start:-12100, end:-12000, icon:'🌌', zeit:'Zeitlos', titel:'Licht und Leere', farbe:'#7c3aed', tooltip:'<b>🌌 Licht und Leere</b><br><i>Zeitlos – vor aller Zeit</i><br><br>Vor aller Zeit existierten nur zwei Urkräfte.', deps:['naaru','alte_goetter'] },
    { id:'naaru', gruppe:'🌌 ZEITLOS', start:-11900, end:-11800, icon:'✨', zeit:'Zeitlos', titel:'Die Naaru', farbe:'#2563eb', tooltip:'<b>✨ Die Naaru</b><br><i>Zeitlos</i><br><br>Wesen des reinen Lichts.', deps:['titanen'] },
    { id:'alte_goetter', gruppe:'🌌 ZEITLOS', start:-11700, end:-11600, icon:'🔮', zeit:'Zeitlos', titel:'Die Alten Götter', farbe:'#dc2626', tooltip:'<b>🔮 Die Alten Götter</b><br><i>Zeitlos</i><br><br>Diener der Leere.', deps:['titanen','loken'] },
    { id:'titanen', gruppe:'⚡ Kosmische Urzeit', start:-10000, end:-9900, icon:'⚡', zeit:'~10.000 BDP', titel:'Die Titanen', farbe:'#d97706', tooltip:'<b>⚡ Die Titanen</b>', deps:['sargeras','nachtelfen'] },
    { id:'sargeras', gruppe:'⚡ Kosmische Urzeit', start:-9500, end:-9400, icon:'🔥', zeit:'~9.500 BDP', titel:'Sargeras fällt', farbe:'#16a34a', tooltip:'<b>🔥 Sargeras fällt</b>', deps:['legion'] },
    { id:'loken', gruppe:'⚡ Kosmische Urzeit', start:-9000, end:-8900, icon:'🗡️', zeit:'~9.000 BDP', titel:'Loken verrät Thorim', farbe:'#b91c1c', tooltip:'<b>🗡️ Loken verrät Thorim</b>', deps:['arthas'] },
    { id:'legion', gruppe:'⚔️ Antike', start:-8000, end:-7900, icon:'💀', zeit:'~8.000 BDP', titel:'Brennende Legion', farbe:'#15803d', tooltip:'<b>💀 Brennende Legion</b>', deps:['krieg_antike'] },
    { id:'nachtelfen', gruppe:'⚔️ Antike', start:-7800, end:-7700, icon:'🌙', zeit:'~7.800 BDP', titel:'Die ersten Nachtelfen', farbe:'#9333ea', tooltip:'<b>🌙 Die ersten Nachtelfen</b>', deps:['brunnen'] },
    { id:'brunnen', gruppe:'⚔️ Antike', start:-7600, end:-7500, icon:'💧', zeit:'~7.600 BDP', titel:'Brunnen der Ewigkeit', farbe:'#06b6d4', tooltip:'<b>💧 Brunnen der Ewigkeit</b>', deps:['krieg_antike'] },
    { id:'krieg_antike', gruppe:'⚔️ Antike', start:-7400, end:-7000, icon:'⚔️', zeit:'~7.400 BDP', titel:'Krieg der Antike', farbe:'#a855f7', tooltip:'<b>⚔️ Krieg der Antike</b>', deps:['sundbrunnen','kaldorei'] },
    { id:'sundbrunnen', gruppe:'⚔️ Antike', start:-7000, end:-6900, icon:'☀️', zeit:'~7.000 BDP', titel:'Sonnenbrunnen', farbe:'#f59e0b', tooltip:'<b>☀️ Sonnenbrunnen</b>', deps:['illidan'] },
    { id:'kaldorei', gruppe:'💀 Moderne', start:-4000, end:-3900, icon:'🌲', zeit:'~4.000 BDP', titel:'Kaldorei-Reich', farbe:'#10b981', tooltip:'<b>🌲 Kaldorei-Reich</b>', deps:['illidan'] },
    { id:'arthas', gruppe:'💀 Moderne', start:20, end:21, icon:'💀', zeit:'20 ADP', titel:'Arthas wird Lichkönig', farbe:'#ef4444', tooltip:'<b>💀 Arthas wird Lichkönig</b>', deps:['illidan'] },
    { id:'illidan', gruppe:'💀 Moderne', start:21, end:22, icon:'👁️', zeit:'21 ADP', titel:'Illidan erwacht', farbe:'#8b5cf6', tooltip:'<b>👁️ Illidan erwacht</b>', deps:[] },
];

// ============================================================
// CSV-PARSER
// ============================================================
function parseCSV(text) {
    const rows = [];
    let row = [], cur = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"') {
                if (text[i+1] === '"') { cur += '"'; i++; }
                else inQuotes = false;
            } else cur += c;
        } else {
            if (c === '"') inQuotes = true;
            else if (c === ',') { row.push(cur); cur = ''; }
            else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
            else if (c === '\r') { /* ignore */ }
            else cur += c;
        }
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
}

// ============================================================
// DATEN LADEN
// ============================================================
async function loadData() {
    if (!CONFIG.sheetUrl) {
        console.log('Keine Sheet-URL gesetzt – Demo-Daten.');
        return DEMO_DATA;
    }
    const res = await fetch(CONFIG.sheetUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const rows = parseCSV(csv);
    if (rows.length < 2) throw new Error('Keine Daten im Sheet');

    return rows.slice(1)
        .filter(r => r[0] && r[0].trim())
        .map(r => ({
            gruppe: (r[0] || '').trim(),
            icon: (r[1] || '').trim(),
            titel: (r[2] || '').trim(),
            zeit: (r[3] || '').trim(),
            start: parseInt(r[4], 10),
            end: r[5] ? parseInt(r[5], 10) : null,
            farbe: (r[6] || '#3b2680').trim(),
            id: (r[7] || '').trim(),
            deps: (r[8] || '').split(',').map(s => s.trim()).filter(Boolean),
            tooltip: (r[9] || '').trim(),
        }))
        .filter(r => !isNaN(r.start) && r.id);
}

// ============================================================
// RENDER
// ============================================================
function render(data) {
    const startYear = Math.min(...data.map(d => d.start));
    const endYear   = Math.max(...data.map(d => d.end || d.start));
    const rangeStart = Math.floor(startYear / 500) * 500 - 200;
    const rangeEnd   = Math.ceil(endYear / 500) * 500 + 200;
    const totalYears = rangeEnd - rangeStart;
    const innerWidth = totalYears * CONFIG.pxPerYear;

    const inner = document.getElementById('timelineInner');
    inner.style.width = innerWidth + 'px';

    const groupsLayer = document.getElementById('groupsLayer');
    const arrowsLayer = document.getElementById('arrows');
    groupsLayer.innerHTML = '';

    // Gruppen in Reihenfolge
    const groupOrder = [];
    const groupMap = {};
    for (const item of data) {
        if (!groupMap[item.gruppe]) {
            groupMap[item.gruppe] = [];
            groupOrder.push(item.gruppe);
        }
        groupMap[item.gruppe].push(item);
    }

    let yCursor = 0;

    for (const groupName of groupOrder) {
        const items = groupMap[groupName];
        const isTimeless = groupName.toLowerCase().includes('zeitlos');

        const groupDiv = document.createElement('div');
        groupDiv.className = 'group';

        const header = document.createElement('div');
        header.className = 'group-header';
        header.textContent = groupName;
        groupDiv.appendChild(header);

        const body = document.createElement('div');
        body.className = 'group-body';
        groupDiv.appendChild(body);

        yCursor += CONFIG.groupHeaderHeight;

        const sorted = [...items].sort((a, b) => a.start - b.start);

        // Zeitlos-Anker-X: alle Items an dieselbe X-Position
        let timelessX = null;
        if (isTimeless && sorted.length > 0) {
            timelessX = (sorted[0].start - rangeStart) * CONFIG.pxPerYear;
        }

        const rows = [];

        for (const item of sorted) {
            let x, w;
            if (isTimeless && timelessX !== null) {
                x = timelessX;
                w = CONFIG.minItemWidth;
            } else {
                const xStart = (item.start - rangeStart) * CONFIG.pxPerYear;
                const xEndRaw = ((item.end || item.start) - rangeStart) * CONFIG.pxPerYear;
                const naturalW = xEndRaw - xStart;
                w = Math.max(naturalW, CONFIG.minItemWidth);
                x = xStart;
            }

            // Erste freie Reihe finden
            let rowIdx = 0;
            for (; rowIdx < rows.length; rowIdx++) {
                if (rows[rowIdx] + 8 <= x) break;
            }
            if (rowIdx === rows.length) rows.push(0);
            rows[rowIdx] = x + w;

            const itemY = rowIdx * (CONFIG.rowHeight + CONFIG.rowGap);

            const el = document.createElement('div');
            el.className = 'item';
            el.style.left = x + 'px';
            el.style.top = itemY + 'px';
            el.style.width = w + 'px';
            el.style.height = CONFIG.rowHeight + 'px';
            el.style.background = item.farbe;
            el.dataset.id = item.id;

            el.innerHTML =
                '<div class="item-zeit">' + escapeHtml(item.icon + ' ' + item.zeit) + '</div>' +
                '<div class="item-titel">' + escapeHtml(item.titel) + '</div>';

            body.appendChild(el);
        }

        const rowsHeight = rows.length * (CONFIG.rowHeight + CONFIG.rowGap);
        body.style.height = rowsHeight + 'px';
        yCursor += rowsHeight + CONFIG.groupPaddingBottom;

        groupsLayer.appendChild(groupDiv);
    }

    const totalHeight = yCursor + 40;
    inner.style.height = totalHeight + 'px';

    // SVG-Größe setzen
    arrowsLayer.setAttribute('width', innerWidth);
    arrowsLayer.setAttribute('height', totalHeight);
    arrowsLayer.setAttribute('viewBox', `0 0 ${innerWidth} ${totalHeight}`);
    arrowsLayer.style.width = innerWidth + 'px';
    arrowsLayer.style.height = totalHeight + 'px';
    arrowsLayer.innerHTML = '';

    // Pfeile zeichnen (nach dem DOM-Render, damit echte Positionen bekannt sind)
    requestAnimationFrame(() => {
        drawArrows(data);
        drawAxis(rangeStart, rangeEnd, innerWidth);
        attachInteractions(data);
    });
}

// ============================================================
// PFEILE – echte DOM-Positionen + farbige Linien
// ============================================================
function drawArrows(data) {
    const svg = document.getElementById('arrows');
    const inner = document.getElementById('timelineInner');
    const innerRect = inner.getBoundingClientRect();

    // Positionen aus dem DOM ermitteln
    const positions = {};
    document.querySelectorAll('.item').forEach(el => {
        const r = el.getBoundingClientRect();
        positions[el.dataset.id] = {
            x: r.left - innerRect.left,
            y: r.top - innerRect.top,
            w: r.width,
            h: r.height,
            item: data.find(d => d.id === el.dataset.id)
        };
    });

    let arrowIndex = 0;

    for (const id in positions) {
        const src = positions[id];
        const item = src.item;
        if (!item) continue;

        for (const targetId of item.deps) {
            const dst = positions[targetId];
            if (!dst) continue;

            const color = ARROW_COLORS[arrowIndex % ARROW_COLORS.length];
            arrowIndex++;

            const x1 = src.x + src.w;
            const y1 = src.y + src.h / 2;
            const x2 = dst.x;
            const y2 = dst.y + dst.h / 2;

            const dx = x2 - x1;
            const dy = y2 - y1;
            let path;

            if (Math.abs(dx) < 30 && Math.abs(dy) > 20) {
                // Vertikal: von unten nach oben
                const sx = src.x + src.w / 2;
                const sy = src.y + src.h;
                const tx = dst.x + dst.w / 2;
                const ty = dst.y;
                path = `M ${sx} ${sy} C ${sx} ${sy + 20}, ${tx} ${ty - 20}, ${tx} ${ty}`;
                drawArrowPath(svg, path, color, tx, ty, 'up');
            } else if (dx > 20) {
                // Vorwärts
                const cx = x1 + dx * 0.5;
                path = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
                drawArrowPath(svg, path, color, x2, y2, 'right');
            } else {
                // Rückwärts / überlappend
                const midY = Math.max(src.y + src.h, dst.y + dst.h) + 25;
                path = `M ${x1} ${y1} Q ${(x1+x2)/2} ${midY}, ${x2} ${y2}`;
                drawArrowPath(svg, path, color, x2, y2, 'right');
            }
        }
    }
}

function drawArrowPath(svg, pathD, color, ax, ay, direction) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', pathD);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', '1.6');
    p.setAttribute('stroke-linecap', 'round');
    svg.appendChild(p);

    // Pfeilspitze
    const size = 6;
    let points;
    if (direction === 'up') {
        points = `${ax},${ay} ${ax - size/2},${ay + size} ${ax + size/2},${ay + size}`;
    } else {
        points = `${ax},${ay} ${ax - size},${ay - size/2} ${ax - size},${ay + size/2}`;
    }
    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    arrow.setAttribute('points', points);
    arrow.setAttribute('fill', color);
    svg.appendChild(arrow);
}

// ============================================================
// ZEITACHSE
// ============================================================
function drawAxis(rangeStart, rangeEnd, innerWidth) {
    const old = document.querySelector('.axis');
    if (old) old.remove();

    const axis = document.createElement('div');
    axis.className = 'axis';
    axis.style.width = innerWidth + 'px';

    for (let y = rangeStart; y <= rangeEnd; y += CONFIG.tickInterval) {
        const x = (y - rangeStart) * CONFIG.pxPerYear;
        const tick = document.createElement('div');
        tick.className = 'axis-tick';
        tick.style.left = x + 'px';

        let label;
        if (y < CONFIG.timelessThreshold) label = 'Zeitlos';
        else if (y < 0) label = Math.abs(y) + ' BDP';
        else label = y + ' ADP';

        tick.textContent = label;
        axis.appendChild(tick);
    }

    document.getElementById('timelineInner').appendChild(axis);
}

// ============================================================
// INTERAKTION
// ============================================================
function attachInteractions(data) {
    const tooltip = document.getElementById('tooltip');

    document.querySelectorAll('.item').forEach(el => {
        el.addEventListener('mouseenter', (e) => {
            const id = el.dataset.id;
            const item = data.find(d => d.id === id);
            if (!item) return;
            tooltip.innerHTML = item.tooltip;
            tooltip.style.display = 'block';
            positionTooltip(e);
        });
        el.addEventListener('mousemove', positionTooltip);
        el.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
        });
        el.addEventListener('click', () => {
            const id = el.dataset.id;
            const item = data.find(d => d.id === id);
            if (!item) return;
            const text = htmlToPlain(item.tooltip);
            navigator.clipboard.writeText(text)
                .then(() => showToast('📋 „' + text.split('\n')[0] + '" kopiert!'))
                .catch(() => showToast('⚠️ Kopieren fehlgeschlagen – HTTPS nötig'));
        });
    });

    function positionTooltip(e) {
        const padding = 14;
        let x = e.clientX + padding;
        let y = e.clientY + padding;
        const rect = tooltip.getBoundingClientRect();
        if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - padding;
        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - padding;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
    }
}

// ============================================================
// HELFER
// ============================================================
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}
function htmlToPlain(html) {
    return html
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/p>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}
let toastTimer = null;
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// ============================================================
// START
// ============================================================
(async function init() {
    const status = document.getElementById('status');
    try {
        const data = await loadData();
        status.textContent = data.length + ' Ereignisse geladen.';
        setTimeout(() => status.style.display = 'none', 1500);
        render(data);
    } catch (err) {
        console.error(err);
        status.classList.add('error');
        status.textContent = '❌ Fehler beim Laden: ' + err.message;
    }
})();
</script>
