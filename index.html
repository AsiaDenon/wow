<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warcraft Lore – Chronologie</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #e8e8e8;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        padding: 20px;
    }
    h1 {
        text-align: center; font-size: 1.7rem; margin: 0 0 8px 0;
        letter-spacing: 1px;
    }
    h1 .logo-yellow {
        color: #F8B700;
        text-shadow: 0 0 22px rgba(248, 183, 0, 0.45), 0 0 4px rgba(248, 183, 0, 0.6);
    }
    .subtitle {
        text-align: center; color: #9ca3af; margin-bottom: 18px;
        font-size: 0.85rem; line-height: 1.6;
        max-width: 760px; margin-left: auto; margin-right: auto;
    }
    .subtitle b { color: #c4b5fd; }

    .timeline-wrap {
        width: 100%; max-width: 1200px; margin: 0 auto;
        background: #0f0f1a;
        border: 1px solid #2a2a3e;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        overflow: auto;
        position: relative;
        height: calc(100vh - 200px);
        min-height: 480px;
    }
    .timeline-wrap::-webkit-scrollbar { width: 12px; height: 12px; }
    .timeline-wrap::-webkit-scrollbar-track {
        background: #1a1a2e; border-radius: 7px;
    }
    .timeline-wrap::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #7c3aed, #2563eb, #16a34a, #ef4444, #8b5cf6);
        border-radius: 7px; border: 2px solid #1a1a2e;
    }
    .timeline-wrap { scrollbar-color: #7c3aed #1a1a2e; scrollbar-width: auto; }

    .timeline-layout {
        display: flex;
        position: relative;
        min-height: 100%;
    }

    /* ---- Vertikale Zeitachse (links, sticky horizontal) ---- */
    .axis-v {
        position: sticky;
        left: 0;
        width: 100px;
        flex-shrink: 0;
        background: #0f0f1a;
        border-right: 1px solid #2a2a3e;
        z-index: 20;
        /* Höhe wird dynamisch gesetzt */
    }
    .axis-tick-v {
        position: absolute;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 12px 0 8px;
        font-size: 0.7rem;
        color: #9ca3af;
        white-space: nowrap;
    }
    .axis-tick-v::after {
        content: '';
        position: absolute;
        right: 0; top: 50%;
        width: 6px;
        border-top: 1px solid #4a4a6e;
    }
    .axis-tick-v.timeless {
        color: #c4b5fd;
        font-style: italic;
    }
    .axis-break {
        position: absolute;
        left: 0;
        width: 100%;
        padding-right: 12px;
        text-align: right;
        font-size: 0.6rem;
        color: #6b7280;
        white-space: nowrap;
        overflow: hidden;
    }

    /* ---- Canvas mit Gruppen & Items ---- */
    .canvas-v {
        position: relative;
        flex: 1;
        min-width: 0;
        /* Höhe wird dynamisch gesetzt */
    }

    /* ---- Gruppen-Header (horizontal, volle Breite) ---- */
    .group-header-v {
        position: absolute;
        left: 0;
        right: 0;
        height: 38px;
        line-height: 38px;
        padding: 0 20px;
        background: linear-gradient(90deg, rgba(124,58,237,0.15) 0%, rgba(124,58,237,0.05) 60%, transparent 100%);
        border-top: 1px solid rgba(196,181,253,0.25);
        border-bottom: 1px solid rgba(196,181,253,0.15);
        font-size: 0.95rem;
        font-weight: 600;
        color: #c4b5fd;
        letter-spacing: 1px;
        z-index: 4;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .group-header-v::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: #7c3aed;
    }

    /* ---- Items ---- */
    .item-v {
        position: absolute;
        background: #3b2680ff;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s;
        display: flex;
        flex-direction: column;
        justify-content: center;
        user-select: text;
        border-left: 3px solid #e91e8c;
        overflow: hidden;
        z-index: 3;
    }
    .item-v:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
        z-index: 6;
    }
    .item-v .item-zeit {
        font-size: 0.65rem;
        color: rgba(255,255,255,0.75);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .item-v .item-titel {
        font-size: 0.82rem;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ---- Pfeile ---- */
    .arrows-v {
        position: absolute;
        top: 0; left: 0;
        pointer-events: none;
        z-index: 1;
    }
    .arrows-v .conn { transition: opacity 0.15s; }
    .arrows-v.has-hl .conn { opacity: 0.12; }
    .arrows-v.has-hl .conn.active { opacity: 1; }
    .arrows-v .conn.active path { stroke-opacity: 1; stroke-width: 2.4; }

    /* ---- Tooltip & Toast ---- */
    .tooltip {
        position: fixed;
        background: rgba(20, 20, 35, 0.97);
        color: #e8e8e8;
        padding: 12px 16px;
        border: 1px solid #4a4a6e;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.7);
        max-width: 360px;
        font-size: 13px;
        line-height: 1.55;
        z-index: 99999;
        pointer-events: none;
        display: none;
    }
    .tooltip b { color: #f59e0b; }
    .tooltip i { color: #9ca3af; }

    .toast {
        position: fixed;
        bottom: 30px; left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(20, 20, 35, 0.96);
        color: #c4b5fd;
        padding: 10px 20px;
        border: 1px solid #4a4a6e;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.6);
        font-size: 0.9rem;
        opacity: 0;
        transition: opacity 0.25s, transform 0.25s;
        pointer-events: none;
        z-index: 10000;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .status {
        text-align: center; color: #c4b5fd; font-size: 0.85rem;
        margin-top: 12px; min-height: 20px;
    }
    .status.error { color: #ef4444; }
</style>
</head>
<body>

<h1><span class="logo-yellow">Warcraft Lore – Chronologie</span></h1>
<p class="subtitle">
    <b>BDP</b> = Before Dark Portal (vor dem Dunklen Portal) · <b>ADP</b> = After Dark Portal (nach dem Dunklen Portal)
</p>

<div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-layout" id="timelineLayout">
        <div class="axis-v" id="axisV"></div>
        <div class="canvas-v" id="canvasV">
            <svg class="arrows-v" id="arrowsV"></svg>
            <div id="sectionsLayer"></div>
            <div id="itemsLayer"></div>
        </div>
    </div>
</div>

<div class="status" id="status">Lade Daten…</div>

<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// KONFIGURATION
// ============================================================
const CONFIG = {
    sheetUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGtORIe7TdQLBiXK6qmWcoC-z-ixoYzMOwySVpKdj0mHxRtH769Hl_HNz6FCdL4u5NMLUPJcfQ3EvZ/pub?output=csv',

    itemHeight: 40,            // feste Höhe eines Items
    itemWidth: 320,            // Breite eines Items
    itemX: 24,                 // linker Rand der Items
    itemGap: 12,               // Abstand zwischen Items (Platz für kurze Pfeile)
    groupHeaderHeight: 32,     // Höhe des Gruppen-Headers
    groupHeaderGap: 8,         // Abstand Header → erstes Item
    groupGap: 16,              // Abstand zwischen Gruppen
    canvasPaddingTop: 12,
    canvasPaddingBottom: 24,
    bigGapYears: 1000,         // ab diesem Zeitsprung erscheint ein Marker auf der Achse
    bigGapExtra: 14,           // zusätzlicher Platz für den Marker
    laneOffset: 20,            // Abstand der ersten Pfeil-Spur zu den Items
    laneSpacing: 9,            // Abstand zwischen Pfeil-Spuren
    cornerRadius: 7,           // Rundung der Pfeil-Ecken
    timelessThreshold: -11500, // Items davor gelten als "Zeitlos"
};

// ============================================================
// PFEIL-FARBEN
// ============================================================
const ARROW_COLORS = [
    '#8a8a8a', '#d4c5a0', '#a8a8a8', '#c9b896', '#b0b0b0',
    '#b8a880', '#7a7a7a', '#e0d5b8', '#9a9a9a', '#cfc1a0',
];

// ============================================================
// DEMO-DATEN
// ============================================================
const DEMO_DATA = [
    { id:'licht', gruppe:'🌌 ZEITLOS', start:-12100, end:-12000, icon:'🌌', zeit:'Zeitlos', titel:'Licht und Leere', farbe:'#7c3aed', tooltip:'<b>🌌 Licht und Leere</b>', deps:['naaru','alte_goetter'] },
    { id:'naaru', gruppe:'🌌 ZEITLOS', start:-11900, end:-11800, icon:'✨', zeit:'Zeitlos', titel:'Die Naaru', farbe:'#2563eb', tooltip:'<b>✨ Die Naaru</b>', deps:['titanen'] },
    { id:'alte_goetter', gruppe:'🌌 ZEITLOS', start:-11700, end:-11600, icon:'🔮', zeit:'Zeitlos', titel:'Die Alten Götter', farbe:'#dc2626', tooltip:'<b>🔮 Die Alten Götter</b>', deps:['titanen','loken'] },
    { id:'titanen', gruppe:'⚡ Kosmische Urzeit', start:-10000, end:-9900, icon:'⚡', zeit:'~10.000 BDP', titel:'Die Titanen', farbe:'#d97706', tooltip:'<b>⚡ Die Titanen</b>', deps:['sargeras','nachtelfen'] },
    { id:'sargeras', gruppe:'⚡ Kosmische Urzeit', start:-9500, end:-9400, icon:'🔥', zeit:'~9.500 BDP', titel:'Sargeras fällt', farbe:'#16a34a', tooltip:'<b>🔥 Sargeras fällt</b>', deps:['legion'] },
    { id:'loken', gruppe:'⚡ Kosmische Urzeit', start:-9000, end:-8900, icon:'🗡️', zeit:'~9.000 BDP', titel:'Loken verrät Thorim', farbe:'#b91c1c', tooltip:'<b>🗡️ Loken verrät Thorim</b>', deps:['arthas'] },
    { id:'legion', gruppe:'⚔️ Antike', start:-8000, end:-7900, icon:'💀', zeit:'~8.000 BDP', titel:'Brennende Legion', farbe:'#15803d', tooltip:'<b>💀 Brennende Legion</b>', deps:['krieg_antike'] },
    { id:'nachtelfen', gruppe:'⚔️ Antike', start:-7800, end:-7700, icon:'🌙', zeit:'~7.800 BDP', titel:'Die ersten Nachtelfen', farbe:'#9333ea', tooltip:'<b>🌙 Die ersten Nachtelfen</b>', deps:['brunnen'] },
    { id:'brunnen', gruppe:'⚔️ Antike', start:-7600, end:-7500, icon:'💧', zeit:'~7.600 BDP', titel:'Brunnen der Ewigkeit', farbe:'#06b6d4', tooltip:'<b>💧 Brunnen der Ewigkeit</b>', deps:['krieg_antike'] },
    { id:'krieg_antike', gruppe:'⚔️ Antike', start:-7400, end:-7000, icon:'⚔️', zeit:'~7.400 BDP', titel:'Krieg der Antike', farbe:'#a855f7', tooltip:'<b>⚔️ Krieg der Antike</b>', deps:['sundbrunnen','kaldorei'] },
    { id:'sundbrunnen', gruppe:'⚔️ Antike', start:-7000, end:-6900, icon:'☀️', zeit:'~7.000 BDP', titel:'Sonnenbrunnen', farbe:'#f59e0b', tooltip:'<b>☀️ Sonnenbrunnen</b>', deps:['illidan'] },
    { id:'kaldorei', gruppe:'💀 Moderne', start:-4000, end:-3900, icon:'🌲', zeit:'~4.000 BDP', titel:'Kaldorei-Reich', farbe:'#10b981', tooltip:'<b>🌲 Kaldorei-Reich</b>', deps:['illidan'] },
    { id:'arthas', gruppe:'💀 Moderne', start:20, end:21, icon:'💀', zeit:'20 ADP', titel:'Arthas wird Lichkönig', farbe:'#ef4444', tooltip:'<b>💀 Arthas wird Lichkönig</b>', deps:['illidan'] },
    { id:'illidan', gruppe:'💀 Moderne', start:21, end:22, icon:'👁️', zeit:'21 ADP', titel:'Illidan erwacht', farbe:'#8b5cf6', tooltip:'<b>👁️ Illidan erwacht</b>', deps:[] },
];

// ============================================================
// CSV-PARSER
// ============================================================
function parseCSV(text) {
    const rows = [];
    let row = [], cur = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"') {
                if (text[i+1] === '"') { cur += '"'; i++; }
                else inQuotes = false;
            } else cur += c;
        } else {
            if (c === '"') inQuotes = true;
            else if (c === ',') { row.push(cur); cur = ''; }
            else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
            else if (c === '\r') { /* ignore */ }
            else cur += c;
        }
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
}

// ============================================================
// DATEN LADEN
// ============================================================
async function loadData() {
    if (!CONFIG.sheetUrl) return DEMO_DATA;
    const res = await fetch(CONFIG.sheetUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const rows = parseCSV(csv);
    if (rows.length < 2) throw new Error('Keine Daten im Sheet');

    const parsed = rows.slice(1)
        .filter(r => r[0] && r[0].trim())
        .map(r => ({
            gruppe: (r[0] || '').trim(),
            icon: (r[1] || '').trim(),
            titel: (r[2] || '').trim(),
            zeit: (r[3] || '').trim(),
            start: parseInt(r[4], 10),
            end: r[5] ? parseInt(r[5], 10) : null,
            farbe: (r[6] || '#3b2680').trim(),
            id: (r[7] || '').trim(),
            deps: (r[8] || '').split(',').map(s => s.trim()).filter(Boolean),
            tooltip: (r[9] || '').trim(),
        }))
        .filter(r => !isNaN(r.start) && r.id);

    if (!parsed.length) throw new Error('Keine gültigen Zeilen im Sheet');
    return parsed;
}

// ============================================================
// RENDER
// ============================================================
function formatYear(y) {
    const n = Math.abs(y).toLocaleString('de-DE');
    return y < 0 ? n + ' BDP' : n + ' ADP';
}

// Farbe Richtung Weiß mischen, damit Pfeile auf dunklem Grund sichtbar bleiben
function lighten(color, amount) {
    const m = /^#([0-9a-f]{6})/i.exec(color || '');
    if (!m) return '#b0b0b0';
    const n = parseInt(m[1], 16);
    const mix = c => Math.round(c + (255 - c) * amount);
    const r = mix((n >> 16) & 255), g = mix((n >> 8) & 255), b = mix(n & 255);
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function svgEl(name, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
}

function render(data) {
    const axisV = document.getElementById('axisV');
    const canvasV = document.getElementById('canvasV');
    const arrowsV = document.getElementById('arrowsV');
    const sectionsLayer = document.getElementById('sectionsLayer');
    const itemsLayer = document.getElementById('itemsLayer');

    axisV.innerHTML = '';
    sectionsLayer.innerHTML = '';
    itemsLayer.innerHTML = '';
    arrowsV.innerHTML = '';

    // ──────────────────────────────────────────────────
    // Gruppen bilden – Zeitlos immer zuerst
    // ──────────────────────────────────────────────────
    const groupMap = {};
    const groupOrder = [];
    for (const item of data) {
        if (!groupMap[item.gruppe]) { groupMap[item.gruppe] = []; groupOrder.push(item.gruppe); }
        groupMap[item.gruppe].push(item);
    }
    const groups = groupOrder.map(name => {
        const items = groupMap[name].slice().sort((a, b) => a.start - b.start);
        const timeless = /zeitlos/i.test(name) || items.every(i => i.start < CONFIG.timelessThreshold);
        return { name, items, timeless };
    });
    groups.sort((a, b) => (b.timeless ? 1 : 0) - (a.timeless ? 1 : 0));   // stabil

    // ──────────────────────────────────────────────────
    // Kompaktes Layout: Items der Reihe nach stapeln
    // ──────────────────────────────────────────────────
    const C = CONFIG;
    const pos = {};              // id -> {x, y, w, h, item, row, group}
    const axisEntries = [];      // Achsen-Labels
    const breaks = [];           // Zeitsprung-Marker
    let y = C.canvasPaddingTop;
    let prevStart = null;
    let row = 0;

    groups.forEach((g, gi) => {
        if (gi > 0) {
            let gap = C.groupGap;
            if (!g.timeless && prevStart !== null) {
                const years = g.items[0].start - prevStart;
                if (years >= C.bigGapYears) { gap += C.bigGapExtra; breaks.push({ y, h: gap, years }); }
            }
            y += gap;
        }

        const headerEl = document.createElement('div');
        headerEl.className = 'group-header-v';
        headerEl.style.top = y + 'px';
        headerEl.style.height = C.groupHeaderHeight + 'px';
        headerEl.style.lineHeight = C.groupHeaderHeight + 'px';
        headerEl.textContent = g.name;
        sectionsLayer.appendChild(headerEl);
        if (g.timeless) axisEntries.push({ y, h: C.groupHeaderHeight, label: 'Zeitlos', timeless: true });
        y += C.groupHeaderHeight + C.groupHeaderGap;

        g.items.forEach((item, idx) => {
            if (idx > 0) {
                let gap = C.itemGap;
                if (!g.timeless) {
                    const years = item.start - prevStart;
                    if (years >= C.bigGapYears) { gap += C.bigGapExtra; breaks.push({ y, h: gap, years }); }
                }
                y += gap;
            }
            pos[item.id] = { x: C.itemX, y, w: C.itemWidth, h: C.itemHeight, item, row: row++, group: gi };
            if (!g.timeless) axisEntries.push({ y, h: C.itemHeight, label: formatYear(item.start) });
            y += C.itemHeight;
            if (!g.timeless) prevStart = item.start;
        });
    });

    const totalHeight = y + C.canvasPaddingBottom;
    axisV.style.height = totalHeight + 'px';
    canvasV.style.height = totalHeight + 'px';

    // Achse
    for (const e of axisEntries) {
        const tick = document.createElement('div');
        tick.className = 'axis-tick-v' + (e.timeless ? ' timeless' : '');
        tick.style.top = e.y + 'px';
        tick.style.height = e.h + 'px';
        tick.textContent = e.label;
        axisV.appendChild(tick);
    }
    for (const b of breaks) {
        const el = document.createElement('div');
        el.className = 'axis-break';
        el.style.top = b.y + 'px';
        el.style.height = b.h + 'px';
        el.style.lineHeight = b.h + 'px';
        el.textContent = '⋮ ' + b.years.toLocaleString('de-DE') + ' J.';
        axisV.appendChild(el);
    }

    // ──────────────────────────────────────────────────
    // Items zeichnen
    // ──────────────────────────────────────────────────
    for (const id in pos) {
        const p = pos[id];
        const el = document.createElement('div');
        el.className = 'item-v';
        el.style.left = p.x + 'px';
        el.style.top = p.y + 'px';
        el.style.width = p.w + 'px';
        el.style.height = p.h + 'px';
        el.style.background = p.item.farbe;
        el.dataset.id = id;
        el.innerHTML =
            '<div class="item-zeit">' + escapeHtml(p.item.icon + ' ' + p.item.zeit) + '</div>' +
            '<div class="item-titel">' + escapeHtml(p.item.titel) + '</div>';
        itemsLayer.appendChild(el);
    }

    // ──────────────────────────────────────────────────
    // Verbindungen sammeln
    // ──────────────────────────────────────────────────
    const straight = [];   // direkter Nachfolger direkt darunter
    const lane = [];       // alles andere: Spur rechts neben den Items
    for (const id in pos) {
        const s = pos[id];
        for (const targetId of s.item.deps) {
            const d = pos[targetId];
            if (!d || d === s) continue;
            const conn = { src: id, dst: targetId, color: lighten(s.item.farbe, 0.4) };
            if (d.row === s.row + 1 && d.group === s.group) straight.push(conn);
            else lane.push(conn);
        }
    }

    // Anschlusspunkte an der rechten Kante verteilen (mehrere Pfeile pro Item)
    const ports = {};
    for (const c of lane) {
        (ports[c.src] = ports[c.src] || []).push({ c, key: 'y1', other: pos[c.dst].y });
        (ports[c.dst] = ports[c.dst] || []).push({ c, key: 'y2', other: pos[c.src].y });
    }
    for (const id in ports) {
        const arr = ports[id].sort((a, b) => a.other - b.other);
        const p = pos[id];
        const n = arr.length;
        const step = n > 1 ? Math.min(5, (p.h - 14) / (n - 1)) : 0;
        arr.forEach((pt, i) => { pt.c[pt.key] = p.y + p.h / 2 + (i - (n - 1) / 2) * step; });
    }

    // Spuren vergeben: kurze Verbindungen innen, lange außen
    lane.sort((a, b) => Math.abs(a.y1 - a.y2) - Math.abs(b.y1 - b.y2));
    const laneUse = [];
    for (const c of lane) {
        const lo = Math.min(c.y1, c.y2), hi = Math.max(c.y1, c.y2);
        let k = 0;
        for (;; k++) {
            const used = laneUse[k] = laneUse[k] || [];
            if (used.every(([l, h]) => hi + 6 < l || lo - 6 > h)) { used.push([lo, hi]); break; }
        }
        c.lane = k;
    }

    const maxLane = lane.reduce((m, c) => Math.max(m, c.lane), -1);
    const canvasWidth = C.itemX + C.itemWidth + C.laneOffset + (maxLane + 1) * C.laneSpacing + 40;
    canvasV.style.minWidth = canvasWidth + 'px';
    arrowsV.style.width = canvasWidth + 'px';
    arrowsV.style.height = totalHeight + 'px';
    arrowsV.setAttribute('width', canvasWidth);
    arrowsV.setAttribute('height', totalHeight);
    arrowsV.setAttribute('viewBox', `0 0 ${canvasWidth} ${totalHeight}`);

    // ──────────────────────────────────────────────────
    // Pfeile zeichnen
    // ──────────────────────────────────────────────────
    const HEAD = 7;
    function addConn(c, d, headPoints, startDot) {
        const g = svgEl('g', { class: 'conn' });
        g.dataset.src = c.src;
        g.dataset.dst = c.dst;
        g.appendChild(svgEl('path', {
            d, fill: 'none', stroke: c.color, 'stroke-opacity': '0.6',
            'stroke-width': '1.7', 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
        }));
        g.appendChild(svgEl('polygon', { points: headPoints, fill: c.color, 'fill-opacity': '0.9' }));
        if (startDot) g.appendChild(svgEl('circle', { cx: startDot[0], cy: startDot[1], r: 2.2, fill: c.color, 'fill-opacity': '0.9' }));
        arrowsV.appendChild(g);
    }

    for (const c of straight) {
        const s = pos[c.src], d = pos[c.dst];
        const x = s.x + s.w / 2;
        const y1 = s.y + s.h, y2 = d.y;
        const h = Math.min(HEAD - 1, (y2 - y1) - 2);
        addConn(c, `M ${x} ${y1} L ${x} ${y2 - h}`,
            `${x},${y2} ${x - 3.5},${y2 - h} ${x + 3.5},${y2 - h}`, [x, y1]);
    }

    for (const c of lane) {
        const s = pos[c.src], d = pos[c.dst];
        const x0 = s.x + s.w;
        const laneX = x0 + C.laneOffset + c.lane * C.laneSpacing;
        const dir = c.y2 > c.y1 ? 1 : -1;
        const r = Math.max(1, Math.min(C.cornerRadius, Math.abs(c.y2 - c.y1) / 2, laneX - x0 - HEAD - 1));
        const dPath =
            `M ${x0} ${c.y1} H ${laneX - r} Q ${laneX} ${c.y1} ${laneX} ${c.y1 + dir * r} ` +
            `V ${c.y2 - dir * r} Q ${laneX} ${c.y2} ${laneX - r} ${c.y2} H ${x0 + HEAD}`;
        addConn(c, dPath,
            `${x0},${c.y2} ${x0 + HEAD},${c.y2 - 3.5} ${x0 + HEAD},${c.y2 + 3.5}`, [x0, c.y1]);
    }

    // Interaktion
    attachInteractions(data);
}

// ============================================================
// INTERAKTION
// ============================================================
function attachInteractions(data) {
    const tooltip = document.getElementById('tooltip');
    const arrows = document.getElementById('arrowsV');

    document.querySelectorAll('.item-v').forEach(el => {
        el.addEventListener('mouseenter', (e) => {
            const id = el.dataset.id;
            arrows.classList.add('has-hl');
            arrows.querySelectorAll('.conn').forEach(g =>
                g.classList.toggle('active', g.dataset.src === id || g.dataset.dst === id));
            const item = data.find(d => d.id === id);
            if (!item) return;
            tooltip.innerHTML = item.tooltip;
            tooltip.style.display = 'block';
            positionTooltip(e);
        });
        el.addEventListener('mousemove', positionTooltip);
        el.addEventListener('mouseleave', () => {
            arrows.classList.remove('has-hl');
            tooltip.style.display = 'none';
        });
        el.addEventListener('click', () => {
            const id = el.dataset.id;
            const item = data.find(d => d.id === id);
            if (!item) return;
            const text = htmlToPlain(item.tooltip);
            navigator.clipboard.writeText(text)
                .then(() => showToast('📋 „' + text.split('\n')[0] + '" kopiert!'))
                .catch(() => showToast('⚠️ Kopieren fehlgeschlagen – HTTPS nötig'));
        });
    });

    function positionTooltip(e) {
        const padding = 14;
        let x = e.clientX + padding;
        let y = e.clientY + padding;
        const rect = tooltip.getBoundingClientRect();
        if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - padding;
        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - padding;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
    }
}

// ============================================================
// HELFER
// ============================================================
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}
function htmlToPlain(html) {
    return html
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/p>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}
let toastTimer = null;
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// ============================================================
// START
// ============================================================
(async function init() {
    const status = document.getElementById('status');
    try {
        const data = await loadData();
        status.textContent = data.length + ' Ereignisse geladen.';
        setTimeout(() => status.style.display = 'none', 1500);
        render(data);
    } catch (err) {
        console.error(err);
        status.classList.add('error');
        status.textContent = '⚠️ Laden fehlgeschlagen (' + err.message + ') – Demo-Daten werden angezeigt.';
        render(DEMO_DATA);
    }
})();
</script>
