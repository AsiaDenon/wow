<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warcraft Lore – Chronologie</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #e8e8e8;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        padding: 20px;
    }
    h1 {
        text-align: center; font-size: 1.7rem; margin: 0 0 8px 0;
        letter-spacing: 1px;
    }
    h1 .logo-yellow {
        color: #F8B700;
        text-shadow: 0 0 22px rgba(248, 183, 0, 0.45), 0 0 4px rgba(248, 183, 0, 0.6);
    }
    .subtitle {
        text-align: center; color: #9ca3af; margin-bottom: 18px;
        font-size: 0.85rem; line-height: 1.6;
        max-width: 760px; margin-left: auto; margin-right: auto;
    }
    .subtitle b { color: #c4b5fd; }

    .timeline-wrap {
        width: 100%; max-width: 1200px; margin: 0 auto;
        background: #0f0f1a;
        border: 1px solid #2a2a3e;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        overflow: auto;
        position: relative;
        height: calc(100vh - 200px);
        min-height: 480px;
    }
    .timeline-wrap::-webkit-scrollbar { width: 12px; height: 12px; }
    .timeline-wrap::-webkit-scrollbar-track {
        background: #1a1a2e; border-radius: 7px;
    }
    .timeline-wrap::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #7c3aed, #2563eb, #16a34a, #ef4444, #8b5cf6);
        border-radius: 7px; border: 2px solid #1a1a2e;
    }
    .timeline-wrap { scrollbar-color: #7c3aed #1a1a2e; scrollbar-width: auto; }

    .timeline-layout {
        display: flex;
        position: relative;
        min-height: 100%;
    }

    /* ---- Vertikale Zeitachse (links, sticky horizontal) ---- */
    .axis-v {
        position: sticky;
        left: 0;
        width: 100px;
        flex-shrink: 0;
        background: #0f0f1a;
        border-right: 1px solid #2a2a3e;
        z-index: 20;
        /* Höhe wird dynamisch gesetzt */
    }
    .axis-tick-v {
        position: absolute;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 12px 0 8px;
        font-size: 0.7rem;
        color: #9ca3af;
        white-space: nowrap;
    }
    .axis-tick-v::after {
        content: '';
        position: absolute;
        right: 0; top: 50%;
        width: 6px;
        border-top: 1px solid #4a4a6e;
    }
    .axis-tick-v.timeless {
        color: #c4b5fd;
        font-style: italic;
    }
    .axis-break {
        position: absolute;
        left: 0;
        width: 100%;
        padding-right: 12px;
        text-align: right;
        font-size: 0.6rem;
        color: #6b7280;
        white-space: nowrap;
        overflow: hidden;
    }

    /* ---- Canvas mit Gruppen & Items ---- */
    .canvas-v {
        position: relative;
        flex: 1;
        min-width: 0;
        /* Höhe wird dynamisch gesetzt */
    }

    /* ---- Gruppen-Header (horizontal, volle Breite) ---- */
    .group-header-v {
        position: absolute;
        left: 0;
        right: 0;
        height: 38px;
        line-height: 38px;
        padding: 0 20px;
        background: linear-gradient(90deg, rgba(124,58,237,0.15) 0%, rgba(124,58,237,0.05) 60%, transparent 100%);
        border-top: 1px solid rgba(196,181,253,0.25);
        border-bottom: 1px solid rgba(196,181,253,0.15);
        font-size: 0.95rem;
        font-weight: 600;
        color: #c4b5fd;
        letter-spacing: 1px;
        z-index: 4;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .group-header-v::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: #7c3aed;
    }

    /* ---- Items ---- */
    .item-v {
        position: absolute;
        background: #3b2680ff;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: default;
        transition: filter 0.15s, transform 0.1s;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        user-select: text;
        border-left: 3px solid #e91e8c;
        overflow: hidden;
        z-index: 3;
    }
    .item-v:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
        z-index: 6;
    }
    .item-v.expandable { padding-right: 28px; }
    .item-v .item-head {
        height: 30px;           /* = itemHeight - 2 * Padding */
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
    }
    .item-v .item-detail {
        margin-top: 2px;
        padding: 6px 0 12px;
        border-top: 1px solid rgba(255,255,255,0.22);
        font-size: 0.75rem;
        line-height: 1.45;
        color: rgba(255,255,255,0.92);
        overflow-wrap: anywhere;
    }
    .item-v .item-detail b { color: #fff; }
    .item-v .item-detail i { color: rgba(255,255,255,0.7); }
    .item-v .item-toggle {
        position: absolute;
        right: 4px; bottom: 2px;
        width: 22px; height: 18px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .item-v .item-toggle::before {
        content: '';
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-top: 6px solid rgba(255,255,255,0.85);
        transition: transform 0.2s;
    }
    .item-v .item-toggle:hover::before { border-top-color: #fff; }
    .item-v.expanded .item-toggle::before { transform: rotate(180deg); }
    .item-measure {
        position: absolute;
        visibility: hidden;
        left: -9999px; top: 0;
        pointer-events: none;
    }
    .item-v .item-zeit {
        font-size: 0.65rem;
        color: rgba(255,255,255,0.75);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .item-v .item-titel {
        font-size: 0.82rem;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ---- Pfeile ---- */
    .arrows-v {
        position: absolute;
        top: 0; left: 0;
        pointer-events: none;
        z-index: 1;
    }
    .arrows-v .conn { transition: opacity 0.15s; }
    .arrows-v.has-hl .conn { opacity: 0.12; }
    .arrows-v.has-hl .conn.active { opacity: 1; }
    .arrows-v .conn.active path { stroke-opacity: 1; stroke-width: 2.4; }

    .status {
        text-align: center; color: #c4b5fd; font-size: 0.85rem;
        margin-top: 12px; min-height: 20px;
    }
    .status.error { color: #ef4444; }
</style>
</head>
<body>

<h1><span class="logo-yellow">Warcraft Lore – Chronologie</span></h1>
<p class="subtitle">
    <b>BDP</b> = Before Dark Portal (vor dem Dunklen Portal) · <b>ADP</b> = After Dark Portal (nach dem Dunklen Portal)
</p>

<div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-layout" id="timelineLayout">
        <div class="axis-v" id="axisV"></div>
        <div class="canvas-v" id="canvasV">
            <svg class="arrows-v" id="arrowsV"></svg>
            <div id="sectionsLayer"></div>
            <div id="itemsLayer"></div>
        </div>
    </div>
</div>

<div class="status" id="status">Lade Daten…</div>


<script>
// ============================================================
// KONFIGURATION
// ============================================================
const CONFIG = {
    sheetUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGtORIe7TdQLBiXK6qmWcoC-z-ixoYzMOwySVpKdj0mHxRtH769Hl_HNz6FCdL4u5NMLUPJcfQ3EvZ/pub?output=csv',

    itemHeight: 40,            // Höhe eines eingeklappten Items
    itemWidth: 320,            // Breite eines Items
    itemX: 24,                 // linker Rand der Items
    itemGap: 12,               // Abstand zwischen Items (Platz für kurze Pfeile)
    groupHeaderHeight: 32,     // Höhe des Gruppen-Headers
    groupHeaderGap: 8,         // Abstand Header → erstes Item
    groupGap: 16,              // Abstand zwischen Gruppen
    canvasPaddingTop: 12,
    canvasPaddingBottom: 24,
    bigGapYears: 1000,         // ab diesem Zeitsprung erscheint ein Marker auf der Achse
    bigGapExtra: 14,           // zusätzlicher Platz für den Marker
    laneOffset: 20,            // Abstand der ersten Pfeil-Spur zu den Items
    laneSpacing: 9,            // Abstand zwischen Pfeil-Spuren
    cornerRadius: 7,           // Rundung der Pfeil-Ecken
    timelessThreshold: -11500, // Items davor gelten als "Zeitlos"
};

// ============================================================
// PFEIL-FARBEN
// ============================================================
const ARROW_COLORS = [
    '#8a8a8a', '#d4c5a0', '#a8a8a8', '#c9b896', '#b0b0b0',
    '#b8a880', '#7a7a7a', '#e0d5b8', '#9a9a9a', '#cfc1a0',
];

// ============================================================
// DEMO-DATEN
// ============================================================
const DEMO_DATA = [
    { id:'licht', gruppe:'🌌 ZEITLOS', start:-12100, end:-12000, icon:'🌌', zeit:'Zeitlos', titel:'Licht und Leere', farbe:'#7c3aed', tooltip:'<b>🌌 Licht und Leere</b>', deps:['naaru','alte_goetter'] },
    { id:'naaru', gruppe:'🌌 ZEITLOS', start:-11900, end:-11800, icon:'✨', zeit:'Zeitlos', titel:'Die Naaru', farbe:'#2563eb', tooltip:'<b>✨ Die Naaru</b>', deps:['titanen'] },
    { id:'alte_goetter', gruppe:'🌌 ZEITLOS', start:-11700, end:-11600, icon:'🔮', zeit:'Zeitlos', titel:'Die Alten Götter', farbe:'#dc2626', tooltip:'<b>🔮 Die Alten Götter</b>', deps:['titanen','loken'] },
    { id:'titanen', gruppe:'⚡ Kosmische Urzeit', start:-10000, end:-9900, icon:'⚡', zeit:'~10.000 BDP', titel:'Die Titanen', farbe:'#d97706', tooltip:'<b>⚡ Die Titanen</b><br>Uralte, gottgleiche Wesen, die Welten ordneten und Azeroth formten.', deps:['sargeras','nachtelfen'] },
    { id:'sargeras', gruppe:'⚡ Kosmische Urzeit', start:-9500, end:-9400, icon:'🔥', zeit:'~9.500 BDP', titel:'Sargeras fällt', farbe:'#16a34a', tooltip:'<b>🔥 Sargeras fällt</b><br>Der größte Titanenkrieger wendet sich ab und gründet die Brennende Legion.<br><i>Ein Wendepunkt der Kosmologie.</i>', deps:['legion'] },
    { id:'loken', gruppe:'⚡ Kosmische Urzeit', start:-9000, end:-8900, icon:'🗡️', zeit:'~9.000 BDP', titel:'Loken verrät Thorim', farbe:'#b91c1c', tooltip:'<b>🗡️ Loken verrät Thorim</b>', deps:['arthas'] },
    { id:'legion', gruppe:'⚔️ Antike', start:-8000, end:-7900, icon:'💀', zeit:'~8.000 BDP', titel:'Brennende Legion', farbe:'#15803d', tooltip:'<b>💀 Brennende Legion</b>', deps:['krieg_antike'] },
    { id:'nachtelfen', gruppe:'⚔️ Antike', start:-7800, end:-7700, icon:'🌙', zeit:'~7.800 BDP', titel:'Die ersten Nachtelfen', farbe:'#9333ea', tooltip:'<b>🌙 Die ersten Nachtelfen</b>', deps:['brunnen'] },
    { id:'brunnen', gruppe:'⚔️ Antike', start:-7600, end:-7500, icon:'💧', zeit:'~7.600 BDP', titel:'Brunnen der Ewigkeit', farbe:'#06b6d4', tooltip:'<b>💧 Brunnen der Ewigkeit</b>', deps:['krieg_antike'] },
    { id:'krieg_antike', gruppe:'⚔️ Antike', start:-7400, end:-7000, icon:'⚔️', zeit:'~7.400 BDP', titel:'Krieg der Antike', farbe:'#a855f7', tooltip:'<b>⚔️ Krieg der Antike</b>', deps:['sundbrunnen','kaldorei'] },
    { id:'sundbrunnen', gruppe:'⚔️ Antike', start:-7000, end:-6900, icon:'☀️', zeit:'~7.000 BDP', titel:'Sonnenbrunnen', farbe:'#f59e0b', tooltip:'<b>☀️ Sonnenbrunnen</b>', deps:['illidan'] },
    { id:'kaldorei', gruppe:'💀 Moderne', start:-4000, end:-3900, icon:'🌲', zeit:'~4.000 BDP', titel:'Kaldorei-Reich', farbe:'#10b981', tooltip:'<b>🌲 Kaldorei-Reich</b>', deps:['illidan'] },
    { id:'arthas', gruppe:'💀 Moderne', start:20, end:21, icon:'💀', zeit:'20 ADP', titel:'Arthas wird Lichkönig', farbe:'#ef4444', tooltip:'<b>💀 Arthas wird Lichkönig</b><br>Der Prinz von Lordaeron greift zu Frostgram und wird zum Lichkönig von Nordend.', deps:['illidan'] },
    { id:'illidan', gruppe:'💀 Moderne', start:21, end:22, icon:'👁️', zeit:'21 ADP', titel:'Illidan erwacht', farbe:'#8b5cf6', tooltip:'<b>👁️ Illidan erwacht</b>', deps:[] },
];

// ============================================================
// CSV-PARSER
// ============================================================
function parseCSV(text) {
    const rows = [];
    let row = [], cur = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"') {
                if (text[i+1] === '"') { cur += '"'; i++; }
                else inQuotes = false;
            } else cur += c;
        } else {
            if (c === '"') inQuotes = true;
            else if (c === ',') { row.push(cur); cur = ''; }
            else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
            else if (c === '\r') { /* ignore */ }
            else cur += c;
        }
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
}

// ============================================================
// DATEN LADEN
// ============================================================
async function loadData() {
    if (!CONFIG.sheetUrl) return DEMO_DATA;
    const res = await fetch(CONFIG.sheetUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const rows = parseCSV(csv);
    if (rows.length < 2) throw new Error('Keine Daten im Sheet');

    const parsed = rows.slice(1)
        .filter(r => r[0] && r[0].trim())
        .map(r => ({
            gruppe: (r[0] || '').trim(),
            icon: (r[1] || '').trim(),
            titel: (r[2] || '').trim(),
            zeit: (r[3] || '').trim(),
            start: parseInt(r[4], 10),
            end: r[5] ? parseInt(r[5], 10) : null,
            farbe: (r[6] || '#3b2680').trim(),
            id: (r[7] || '').trim(),
            deps: (r[8] || '').split(',').map(s => s.trim()).filter(Boolean),
            tooltip: (r[9] || '').trim(),
        }))
        .filter(r => !isNaN(r.start) && r.id);

    if (!parsed.length) throw new Error('Keine gültigen Zeilen im Sheet');
    return parsed;
}

// ============================================================
// RENDER
// ============================================================
function formatYear(y) {
    const n = Math.abs(y).toLocaleString('de-DE');
    return y < 0 ? n + ' BDP' : n + ' ADP';
}

// Farbe Richtung Weiß mischen, damit Pfeile auf dunklem Grund sichtbar bleiben
function lighten(color, amount) {
    const m = /^#([0-9a-f]{6})/i.exec(color || '');
    if (!m) return '#b0b0b0';
    const n = parseInt(m[1], 16);
    const mix = c => Math.round(c + (255 - c) * amount);
    const r = mix((n >> 16) & 255), g = mix((n >> 8) & 255), b = mix(n & 255);
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function svgEl(name, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
}

const expanded = new Set();   // IDs der aufgeklappten Items
let currentData = [];
let state = null;             // { layout, list, els, geom }
let animHandle = null;
const HEAD = 7;               // Länge der Pfeilspitze
const ANIM_MS = 280;

// Tooltip-Text ohne die Titelzeile = Detailtext (leer → nicht ausklappbar)
function getDetail(item) {
    if (item._detail !== undefined) return item._detail;
    let html = item.tooltip || '';
    const m = /^\s*<b>([\s\S]*?)<\/b>\s*(?:<br\s*\/?>\s*)*/i.exec(html);
    if (m && htmlToPlain(m[1]).includes(item.titel)) html = html.slice(m[0].length);
    item._detail = htmlToPlain(html) ? html : '';
    return item._detail;
}

// Höhe des Detailtexts messen (gleiche Breite/Padding wie ein echtes, ausklappbares Item)
function getDetailHeight(item) {
    if (item._dh !== undefined) return item._dh;
    const probe = document.createElement('div');
    probe.className = 'item-v expandable item-measure';
    probe.style.width = CONFIG.itemWidth + 'px';
    probe.style.height = 'auto';
    probe.innerHTML = '<div class="item-detail">' + getDetail(item) + '</div>';
    document.body.appendChild(probe);
    item._dh = probe.firstChild.offsetHeight + 2;   // + margin-top
    document.body.removeChild(probe);
    return item._dh;
}

// ──────────────────────────────────────────────────
// Layout (rein berechnend, ohne DOM)
// ──────────────────────────────────────────────────
function computeLayout(data) {
    const C = CONFIG;
    const groupMap = {};
    const groupOrder = [];
    for (const item of data) {
        if (!groupMap[item.gruppe]) { groupMap[item.gruppe] = []; groupOrder.push(item.gruppe); }
        groupMap[item.gruppe].push(item);
    }
    const groups = groupOrder.map(name => {
        const items = groupMap[name].slice().sort((a, b) => a.start - b.start);
        const timeless = /zeitlos/i.test(name) || items.every(i => i.start < C.timelessThreshold);
        return { name, items, timeless };
    });
    groups.sort((a, b) => (b.timeless ? 1 : 0) - (a.timeless ? 1 : 0));   // Zeitlos zuerst (stabil)

    const pos = {}, headers = [], axis = [], breaks = [];
    let y = C.canvasPaddingTop;
    let prevStart = null;
    let row = 0;

    groups.forEach((g, gi) => {
        if (gi > 0) {
            let gap = C.groupGap;
            if (!g.timeless && prevStart !== null) {
                const years = g.items[0].start - prevStart;
                if (years >= C.bigGapYears) { gap += C.bigGapExtra; breaks.push({ y, h: gap, years }); }
            }
            y += gap;
        }
        headers.push({ y, name: g.name });
        if (g.timeless) axis.push({ y, h: C.groupHeaderHeight, label: 'Zeitlos', timeless: true });
        y += C.groupHeaderHeight + C.groupHeaderGap;

        g.items.forEach((item, idx) => {
            if (idx > 0) {
                let gap = C.itemGap;
                if (!g.timeless) {
                    const years = item.start - prevStart;
                    if (years >= C.bigGapYears) { gap += C.bigGapExtra; breaks.push({ y, h: gap, years }); }
                }
                y += gap;
            }
            const h = C.itemHeight + ((expanded.has(item.id) && getDetail(item)) ? getDetailHeight(item) : 0);
            pos[item.id] = { x: C.itemX, y, w: C.itemWidth, h, item, row: row++, group: gi };
            if (!g.timeless) axis.push({ y, h: C.itemHeight, label: formatYear(item.start) });
            y += h;
            if (!g.timeless) prevStart = item.start;
        });
    });

    return { pos, headers, axis, breaks, total: y + C.canvasPaddingBottom };
}

// ──────────────────────────────────────────────────
// Verbindungen: Art, Anschlusspunkte, Spuren
// ──────────────────────────────────────────────────
function computeConns(layout) {
    const C = CONFIG, pos = layout.pos;
    const list = [];
    for (const id in pos) {
        const s = pos[id];
        for (const targetId of s.item.deps) {
            const d = pos[targetId];
            if (!d || d === s) continue;
            list.push({
                key: id + '>' + targetId, src: id, dst: targetId,
                color: lighten(s.item.farbe, 0.4),
                straight: d.row === s.row + 1 && d.group === s.group,
                lane: 0, o1: 0, o2: 0
            });
        }
    }
    const laneConns = list.filter(c => !c.straight);

    // Anschlusspunkte an der rechten Kante verteilen (Offset relativ zur Header-Mitte)
    const ports = {};
    for (const c of laneConns) {
        (ports[c.src] = ports[c.src] || []).push({ c, key: 'o1', other: pos[c.dst].y });
        (ports[c.dst] = ports[c.dst] || []).push({ c, key: 'o2', other: pos[c.src].y });
    }
    for (const id in ports) {
        const arr = ports[id].sort((a, b) => a.other - b.other);
        const n = arr.length;
        const step = n > 1 ? Math.min(5, (C.itemHeight - 14) / (n - 1)) : 0;
        arr.forEach((pt, i) => { pt.c[pt.key] = (i - (n - 1) / 2) * step; });
    }

    // Spuren vergeben: kurze Verbindungen innen, lange außen
    const mid = id => pos[id].y + C.itemHeight / 2;
    const sorted = laneConns.slice().sort((a, b) =>
        Math.abs(mid(a.src) + a.o1 - mid(a.dst) - a.o2) - Math.abs(mid(b.src) + b.o1 - mid(b.dst) - b.o2));
    const laneUse = [];
    for (const c of sorted) {
        const y1 = mid(c.src) + c.o1, y2 = mid(c.dst) + c.o2;
        const lo = Math.min(y1, y2), hi = Math.max(y1, y2);
        let k = 0;
        for (;; k++) {
            const used = laneUse[k] = laneUse[k] || [];
            if (used.every(([l, h]) => hi + 6 < l || lo - 6 > h)) { used.push([lo, hi]); break; }
        }
        c.lane = k;
    }
    return { list, maxLane: laneConns.reduce((m, c) => Math.max(m, c.lane), -1) };
}

// ──────────────────────────────────────────────────
// Geometrie (alles, was sich beim Aufklappen verändert) + Interpolation
// ──────────────────────────────────────────────────
function geomOf(layout, cs) {
    const C = CONFIG;
    const items = {};
    for (const id in layout.pos) items[id] = { y: layout.pos[id].y, h: layout.pos[id].h };
    const conns = {};
    for (const c of cs.list) if (!c.straight) conns[c.key] = { lane: c.lane, o1: c.o1, o2: c.o2 };
    return {
        items,
        headers: layout.headers.map(h => h.y),
        axis: layout.axis.map(a => a.y),
        breaks: layout.breaks.map(b => b.y),
        total: layout.total,
        width: C.itemX + C.itemWidth + C.laneOffset + (cs.maxLane + 1) * C.laneSpacing + 40,
        conns
    };
}

const lerp = (a, b, t) => a + (b - a) * t;
function lerpGeom(a, b, t) {
    const items = {};
    for (const id in b.items) items[id] = { y: lerp(a.items[id].y, b.items[id].y, t), h: lerp(a.items[id].h, b.items[id].h, t) };
    const conns = {};
    for (const k in b.conns) {
        const p = a.conns[k] || b.conns[k], q = b.conns[k];
        conns[k] = { lane: lerp(p.lane, q.lane, t), o1: lerp(p.o1, q.o1, t), o2: lerp(p.o2, q.o2, t) };
    }
    const arr = (x, y) => y.map((v, i) => lerp(x[i], v, t));
    return {
        items, conns,
        headers: arr(a.headers, b.headers), axis: arr(a.axis, b.axis), breaks: arr(a.breaks, b.breaks),
        total: lerp(a.total, b.total, t), width: lerp(a.width, b.width, t)
    };
}

// Geometrie ins DOM schreiben (Items, Header, Achse, Pfeile)
function applyGeom(g) {
    const C = CONFIG;
    const { layout, list, els } = state;

    for (const id in els.items) {
        els.items[id].style.top = g.items[id].y + 'px';
        els.items[id].style.height = g.items[id].h + 'px';
    }
    els.headers.forEach((el, i) => el.style.top = g.headers[i] + 'px');
    els.axis.forEach((el, i) => el.style.top = g.axis[i] + 'px');
    els.breaks.forEach((el, i) => el.style.top = g.breaks[i] + 'px');

    const canvasV = document.getElementById('canvasV');
    const axisV = document.getElementById('axisV');
    const arrowsV = document.getElementById('arrowsV');
    axisV.style.height = g.total + 'px';
    canvasV.style.height = g.total + 'px';
    canvasV.style.minWidth = g.width + 'px';
    arrowsV.style.width = g.width + 'px';
    arrowsV.style.height = g.total + 'px';
    arrowsV.setAttribute('width', g.width);
    arrowsV.setAttribute('height', g.total);
    arrowsV.setAttribute('viewBox', `0 0 ${g.width} ${g.total}`);

    for (const c of list) {
        const s = layout.pos[c.src], d = layout.pos[c.dst];
        const gs = g.items[c.src], gd = g.items[c.dst];
        let dPath, head, dot;
        if (c.straight) {
            const x = s.x + s.w / 2;
            const y1 = gs.y + gs.h, y2 = gd.y;
            const h = Math.max(0, Math.min(HEAD - 1, y2 - y1 - 2));
            dPath = `M ${x} ${y1} L ${x} ${y2 - h}`;
            head = `${x},${y2} ${x - 3.5},${y2 - h} ${x + 3.5},${y2 - h}`;
            dot = [x, y1];
        } else {
            const o = g.conns[c.key];
            const x0 = s.x + s.w;
            const y1 = gs.y + C.itemHeight / 2 + o.o1;
            const y2 = gd.y + C.itemHeight / 2 + o.o2;
            const laneX = x0 + C.laneOffset + o.lane * C.laneSpacing;
            const dir = y2 > y1 ? 1 : -1;
            const r = Math.max(1, Math.min(C.cornerRadius, Math.abs(y2 - y1) / 2, laneX - x0 - HEAD - 1));
            dPath =
                `M ${x0} ${y1} H ${laneX - r} Q ${laneX} ${y1} ${laneX} ${y1 + dir * r} ` +
                `V ${y2 - dir * r} Q ${laneX} ${y2} ${laneX - r} ${y2} H ${x0 + HEAD}`;
            head = `${x0},${y2} ${x0 + HEAD},${y2 - 3.5} ${x0 + HEAD},${y2 + 3.5}`;
            dot = [x0, y1];
        }
        c.el.path.setAttribute('d', dPath);
        c.el.poly.setAttribute('points', head);
        c.el.dot.setAttribute('cx', dot[0]);
        c.el.dot.setAttribute('cy', dot[1]);
    }
}

// ──────────────────────────────────────────────────
// Aufbau (einmalig)
// ──────────────────────────────────────────────────
function render(data) {
    currentData = data;
    if (animHandle) { cancelAnimationFrame(animHandle); animHandle = null; }
    const axisV = document.getElementById('axisV');
    const sectionsLayer = document.getElementById('sectionsLayer');
    const itemsLayer = document.getElementById('itemsLayer');
    const arrowsV = document.getElementById('arrowsV');
    axisV.innerHTML = '';
    sectionsLayer.innerHTML = '';
    itemsLayer.innerHTML = '';
    arrowsV.innerHTML = '';

    const C = CONFIG;
    const layout = computeLayout(data);
    const cs = computeConns(layout);
    const els = { items: {}, headers: [], axis: [], breaks: [] };

    for (const h of layout.headers) {
        const el = document.createElement('div');
        el.className = 'group-header-v';
        el.style.height = C.groupHeaderHeight + 'px';
        el.style.lineHeight = C.groupHeaderHeight + 'px';
        el.textContent = h.name;
        sectionsLayer.appendChild(el);
        els.headers.push(el);
    }
    for (const a of layout.axis) {
        const el = document.createElement('div');
        el.className = 'axis-tick-v' + (a.timeless ? ' timeless' : '');
        el.style.height = a.h + 'px';
        el.textContent = a.label;
        axisV.appendChild(el);
        els.axis.push(el);
    }
    for (const b of layout.breaks) {
        const el = document.createElement('div');
        el.className = 'axis-break';
        el.style.height = b.h + 'px';
        el.style.lineHeight = b.h + 'px';
        el.textContent = '⋮ ' + b.years.toLocaleString('de-DE') + ' J.';
        axisV.appendChild(el);
        els.breaks.push(el);
    }
    for (const id in layout.pos) {
        const p = layout.pos[id];
        const el = document.createElement('div');
        el.className = 'item-v';
        el.style.left = p.x + 'px';
        el.style.width = p.w + 'px';
        el.style.background = p.item.farbe;
        el.dataset.id = id;
        const canExpand = !!getDetail(p.item);
        const isOpen = canExpand && expanded.has(id);
        if (canExpand) el.classList.add('expandable');
        if (isOpen) el.classList.add('expanded');
        el.innerHTML =
            '<div class="item-head">' +
                '<div class="item-zeit">' + escapeHtml(p.item.icon + ' ' + p.item.zeit) + '</div>' +
                '<div class="item-titel">' + escapeHtml(p.item.titel) + '</div>' +
            '</div>' +
            (isOpen ? '<div class="item-detail">' + getDetail(p.item) + '</div>' : '') +
            (canExpand
                ? '<button class="item-toggle" type="button" aria-expanded="' + isOpen +
                  '" aria-label="' + (isOpen ? 'Einklappen' : 'Ausklappen') + '"></button>'
                : '');
        itemsLayer.appendChild(el);
        els.items[id] = el;
    }
    for (const c of cs.list) {
        const g = svgEl('g', { class: 'conn' });
        g.dataset.src = c.src;
        g.dataset.dst = c.dst;
        const path = svgEl('path', {
            fill: 'none', stroke: c.color, 'stroke-opacity': '0.6',
            'stroke-width': '1.7', 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
        });
        const poly = svgEl('polygon', { fill: c.color, 'fill-opacity': '0.9' });
        const dot = svgEl('circle', { r: 2.2, fill: c.color, 'fill-opacity': '0.9' });
        g.append(path, poly, dot);
        arrowsV.appendChild(g);
        c.el = { path, poly, dot };
    }

    state = { layout, list: cs.list, els, geom: geomOf(layout, cs) };
    applyGeom(state.geom);
    attachInteractions(data);
}

// ──────────────────────────────────────────────────
// Auf-/Zuklappen mit Animation
// ──────────────────────────────────────────────────
function removeClosedDetails() {
    for (const id in state.els.items) {
        if (expanded.has(id)) continue;
        const d = state.els.items[id].querySelector('.item-detail');
        if (d) d.remove();
    }
}

function toggleItem(id) {
    const el = state.els.items[id];
    const item = state.layout.pos[id].item;
    const opening = !expanded.has(id);
    if (opening) expanded.add(id); else expanded.delete(id);

    el.classList.toggle('expanded', opening);
    const btn = el.querySelector('.item-toggle');
    if (btn) {
        btn.setAttribute('aria-expanded', opening);
        btn.setAttribute('aria-label', opening ? 'Einklappen' : 'Ausklappen');
    }
    if (opening && !el.querySelector('.item-detail')) {
        const d = document.createElement('div');
        d.className = 'item-detail';
        d.innerHTML = getDetail(item);
        el.insertBefore(d, btn);
    }

    // Neue Ziel-Geometrie; Start = aktueller (ggf. halb animierter) Zustand
    const layout = computeLayout(currentData);
    const cs = computeConns(layout);
    const target = geomOf(layout, cs);
    const from = state.geom;
    state.layout = layout;
    if (animHandle) { cancelAnimationFrame(animHandle); animHandle = null; }

    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
        state.geom = target;
        applyGeom(target);
        removeClosedDetails();
        return;
    }
    const t0 = performance.now();
    const frame = (now) => {
        const t = Math.min(1, (now - t0) / ANIM_MS);
        const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // easeInOutCubic
        state.geom = t < 1 ? lerpGeom(from, target, e) : target;
        applyGeom(state.geom);
        if (t < 1) animHandle = requestAnimationFrame(frame);
        else { animHandle = null; removeClosedDetails(); }
    };
    animHandle = requestAnimationFrame(frame);
}

// ============================================================
// INTERAKTION
// ============================================================
function attachInteractions(data) {
    const arrows = document.getElementById('arrowsV');

    document.querySelectorAll('.item-v').forEach(el => {
        const id = el.dataset.id;
        el.addEventListener('mouseenter', () => {
            arrows.classList.add('has-hl');
            arrows.querySelectorAll('.conn').forEach(g =>
                g.classList.toggle('active', g.dataset.src === id || g.dataset.dst === id));
        });
        el.addEventListener('mouseleave', () => arrows.classList.remove('has-hl'));

        const toggle = el.querySelector('.item-toggle');
        if (toggle) toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleItem(id);
        });
    });
}

// ============================================================
// HELFER
// ============================================================
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}
function htmlToPlain(html) {
    return html
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/p>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}
// ============================================================
// START
// ============================================================
(async function init() {
    const status = document.getElementById('status');
    try {
        const data = await loadData();
        status.textContent = data.length + ' Ereignisse geladen.';
        setTimeout(() => status.style.display = 'none', 1500);
        render(data);
    } catch (err) {
        console.error(err);
        status.classList.add('error');
        status.textContent = '⚠️ Laden fehlgeschlagen (' + err.message + ') – Demo-Daten werden angezeigt.';
        render(DEMO_DATA);
    }
})();
</script>
